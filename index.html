<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Gift For You</title>
    <style>
        :root {
            --surface-0: #05070C;
            --surface-1: #0A0D12;
            --surface-2: #0F131C;
            --surface-3: #161D2B;
            --accent: #FFB5E8;
            --accent-warm: #FF9CEE;
            --text: #FFFFFF;
            --bee-yellow: #FFD93D;
            --bee-black: #1A1A1A;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            position: relative;
        }

        .sunrise-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                180deg,
                #1a1042 0%,
                #2d1b69 15%,
                #5b3a9f 30%,
                #d4667c 50%,
                #f9a471 65%,
                #ffd89b 80%,
                #ffe9c5 100%
            );
            animation: sunrise 8s ease-in-out infinite alternate;
        }

        @keyframes sunrise {
            0% {
                filter: brightness(0.6);
            }
            100% {
                filter: brightness(1.2);
            }
        }

        .sun {
            position: absolute;
            bottom: 30%;
            left: 50%;
            transform: translateX(-50%);
            width: clamp(100px, 15vw, 200px);
            height: clamp(100px, 15vw, 200px);
            background: radial-gradient(circle, #FFF5E1 0%, #FFD700 40%, #FF8C00 100%);
            border-radius: 50%;
            box-shadow: 0 0 60px 30px rgba(255, 215, 0, 0.6);
            animation: sunPulse 4s ease-in-out infinite;
        }

        @keyframes sunPulse {
            0%, 100% {
                transform: translateX(-50%) scale(1);
                box-shadow: 0 0 60px 30px rgba(255, 215, 0, 0.6);
            }
            50% {
                transform: translateX(-50%) scale(1.1);
                box-shadow: 0 0 80px 40px rgba(255, 215, 0, 0.8);
            }
        }

        .message {
            position: absolute;
            top: clamp(60px, 15vh, 120px);
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            z-index: 10;
            animation: fadeIn 2s ease-in;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }

        .message h1 {
            font-size: clamp(1.5rem, 5vw, 3.5rem);
            color: var(--text);
            text-shadow: 3px 3px 12px rgba(0, 0, 0, 0.7),
                         0 0 20px rgba(255, 181, 232, 0.8);
            letter-spacing: -0.02em;
            line-height: 1.3;
            font-weight: 700;
        }

        .characters {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: flex-end;
            gap: 20px;
            z-index: 5;
            animation: slideUp 2s ease-out 0.5s backwards;
        }

        @keyframes slideUp {
            from {
                bottom: -200px;
                opacity: 0;
            }
            to {
                bottom: 0;
                opacity: 1;
            }
        }

        .character {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        .hello-kitty, .spiderman {
            width: clamp(100px, 20vw, 180px);
            height: clamp(120px, 24vw, 220px);
            position: relative;
            animation: bounce 3s ease-in-out infinite;
        }

        .spiderman {
            animation-delay: 0.3s;
        }

        @keyframes bounce {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-15px);
            }
        }

        /* Hello Kitty */
        .hello-kitty .head {
            width: 80%;
            height: 60%;
            background: #fff;
            border-radius: 50%;
            position: relative;
            left: 10%;
            border: 3px solid #333;
        }

        .hello-kitty .ear {
            width: 35%;
            height: 35%;
            background: #fff;
            border-radius: 50%;
            position: absolute;
            top: 5%;
            border: 3px solid #333;
        }

        .hello-kitty .ear.left {
            left: 5%;
        }

        .hello-kitty .ear.right {
            right: 5%;
        }

        .hello-kitty .bow {
            width: 30%;
            height: 20%;
            background: #FF1493;
            border-radius: 50%;
            position: absolute;
            top: 15%;
            left: -5%;
            border: 2px solid #C71585;
        }

        .hello-kitty .bow::after {
            content: '';
            width: 50%;
            height: 50%;
            background: #FF1493;
            border-radius: 50%;
            position: absolute;
            right: -40%;
            top: 25%;
            border: 2px solid #C71585;
        }

        .hello-kitty .eye {
            width: 10%;
            height: 10%;
            background: #333;
            border-radius: 50%;
            position: absolute;
            top: 40%;
        }

        .hello-kitty .eye.left {
            left: 30%;
        }

        .hello-kitty .eye.right {
            right: 30%;
        }

        .hello-kitty .nose {
            width: 15%;
            height: 8%;
            background: #FFD700;
            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
            position: absolute;
            top: 52%;
            left: 42.5%;
            border: 2px solid #333;
        }

        .hello-kitty .whiskers {
            position: absolute;
            width: 25%;
            height: 2px;
            background: #333;
            top: 55%;
        }

        .hello-kitty .whiskers.left-top {
            left: 5%;
            transform: rotate(-10deg);
        }

        .hello-kitty .whiskers.left-bottom {
            left: 5%;
            top: 60%;
            transform: rotate(10deg);
        }

        .hello-kitty .whiskers.right-top {
            right: 5%;
            transform: rotate(10deg);
        }

        .hello-kitty .whiskers.right-bottom {
            right: 5%;
            top: 60%;
            transform: rotate(-10deg);
        }

        .hello-kitty .body {
            width: 70%;
            height: 40%;
            background: #fff;
            border-radius: 20px;
            position: absolute;
            bottom: 0;
            left: 15%;
            border: 3px solid #333;
        }

        /* Spiderman */
        .spiderman .head {
            width: 70%;
            height: 50%;
            background: #DC143C;
            border-radius: 50%;
            position: relative;
            left: 15%;
            border: 3px solid #8B0000;
            overflow: hidden;
        }

        .spiderman .web-pattern {
            position: absolute;
            width: 100%;
            height: 100%;
            background: 
                linear-gradient(90deg, transparent 48%, #000 48%, #000 52%, transparent 52%),
                linear-gradient(0deg, transparent 48%, #000 48%, #000 52%, transparent 52%),
                radial-gradient(circle at 50% 40%, transparent 20%, transparent 20%, transparent 40%, #000 40%, #000 41%, transparent 41%, transparent 60%, #000 60%, #000 61%, transparent 61%);
        }

        .spiderman .eye {
            width: 35%;
            height: 30%;
            background: #fff;
            position: absolute;
            top: 35%;
            clip-path: polygon(0% 50%, 20% 20%, 80% 0%, 100% 40%, 70% 100%, 30% 100%);
            border: 2px solid #000;
        }

        .spiderman .eye.left {
            left: 10%;
        }

        .spiderman .eye.right {
            right: 10%;
            transform: scaleX(-1);
        }

        .spiderman .body {
            width: 65%;
            height: 50%;
            background: #DC143C;
            border-radius: 20px;
            position: absolute;
            bottom: 0;
            left: 17.5%;
            border: 3px solid #8B0000;
        }

        .spiderman .spider-logo {
            width: 40%;
            height: 50%;
            background: #000;
            position: absolute;
            top: 10%;
            left: 30%;
            clip-path: polygon(50% 0%, 70% 30%, 100% 30%, 80% 50%, 90% 80%, 50% 65%, 10% 80%, 20% 50%, 0% 30%, 30% 30%);
        }

        .holding-hands {
            width: 60px;
            height: 3px;
            background: #FFB5E8;
            position: absolute;
            bottom: 40%;
            left: 50%;
            transform: translateX(-50%);
            box-shadow: 0 0 10px rgba(255, 181, 232, 0.8);
        }

        .flowers {
            position: absolute;
            bottom: 10px;
            display: flex;
            gap: 15px;
            animation: flowersGrow 2s ease-out 1s backwards;
        }

        @keyframes flowersGrow {
            from {
                transform: scale(0);
                opacity: 0;
            }
            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        .flower {
            width: clamp(30px, 5vw, 50px);
            height: clamp(30px, 5vw, 50px);
            position: relative;
            animation: flowerSway 3s ease-in-out infinite;
        }

        .flower:nth-child(2) {
            animation-delay: 0.5s;
        }

        .flower:nth-child(3) {
            animation-delay: 1s;
        }

        @keyframes flowerSway {
            0%, 100% {
                transform: rotate(-5deg);
            }
            50% {
                transform: rotate(5deg);
            }
        }

        .flower .petal {
            width: 50%;
            height: 50%;
            background: var(--accent);
            border-radius: 50%;
            position: absolute;
            top: 25%;
            left: 25%;
        }

        .flower .petal:nth-child(1) {
            transform: translateY(-50%);
        }

        .flower .petal:nth-child(2) {
            transform: translateY(50%);
        }

        .flower .petal:nth-child(3) {
            transform: translateX(-50%);
        }

        .flower .petal:nth-child(4) {
            transform: translateX(50%);
        }

        .flower .center {
            width: 40%;
            height: 40%;
            background: #FFD93D;
            border-radius: 50%;
            position: absolute;
            top: 30%;
            left: 30%;
            z-index: 1;
        }

        .flower .stem {
            width: 3px;
            height: 40px;
            background: #2D5016;
            position: absolute;
            bottom: -40px;
            left: 50%;
            transform: translateX(-50%);
        }

        .flowers.left {
            left: 15%;
        }

        .flowers.right {
            right: 15%;
        }

        .bee {
            position: absolute;
            width: clamp(30px, 4vw, 50px);
            height: clamp(25px, 3.5vw, 40px);
            animation: fly 8s ease-in-out infinite;
        }

        .bee:nth-child(1) {
            top: 20%;
            left: 10%;
            animation-duration: 7s;
        }

        .bee:nth-child(2) {
            top: 40%;
            right: 15%;
            animation-duration: 9s;
            animation-delay: 1s;
        }

        .bee:nth-child(3) {
            top: 60%;
            left: 20%;
            animation-duration: 10s;
            animation-delay: 2s;
        }

        @keyframes fly {
            0%, 100% {
                transform: translate(0, 0) rotate(0deg);
            }
            25% {
                transform: translate(30px, -20px) rotate(5deg);
            }
            50% {
                transform: translate(60px, 10px) rotate(-5deg);
            }
            75% {
                transform: translate(30px, 30px) rotate(3deg);
            }
        }

        .bee .body-bee {
            width: 100%;
            height: 70%;
            background: var(--bee-yellow);
            border-radius: 999px;
            position: relative;
            border: 2px solid var(--bee-black);
        }

        .bee .stripe {
            width: 25%;
            height: 100%;
            background: var(--bee-black);
            position: absolute;
            top: 0;
        }

        .bee .stripe:nth-child(1) {
            left: 25%;
        }

        .bee .stripe:nth-child(2) {
            left: 55%;
        }

        .bee .wing {
            width: 45%;
            height: 60%;
            background: rgba(255, 255, 255, 0.6);
            border-radius: 50%;
            position: absolute;
            top: 0;
            border: 1px solid rgba(255, 255, 255, 0.8);
            animation: wingFlap 0.3s ease-in-out infinite;
        }

        @keyframes wingFlap {
            0%, 100% {
                transform: translateY(0) scaleY(1);
            }
            50% {
                transform: translateY(-3px) scaleY(1.1);
            }
        }

        .bee .wing.left {
            left: 10%;
        }

        .bee .wing.right {
            right: 10%;
        }

        .bee .head-bee {
            width: 35%;
            height: 35%;
            background: var(--bee-black);
            border-radius: 50%;
            position: absolute;
            top: 20%;
            right: -15%;
        }

        .bee .antenna {
            width: 2px;
            height: 12px;
            background: var(--bee-black);
            position: absolute;
            top: -10px;
        }

        .bee .antenna.left {
            right: 10px;
            transform: rotate(-20deg);
        }

        .bee .antenna.right {
            right: 5px;
            transform: rotate(20deg);
        }

        .bee .antenna::after {
            content: '';
            width: 5px;
            height: 5px;
            background: var(--bee-black);
            border-radius: 50%;
            position: absolute;
            top: -3px;
            left: 50%;
            transform: translateX(-50%);
        }
    </style>
</head>
<body>
    <div class="sunrise-bg"></div>
    <div class="sun"></div>
    
    <div class="message">
        <h1>I Hope You're Having<br>A Great Day!</h1>
    </div>

    <div class="bee">
        <div class="wing left"></div>
        <div class="wing right"></div>
        <div class="body-bee">
            <div class="stripe"></div>
            <div class="stripe"></div>
        </div>
        <div class="head-bee">
            <div class="antenna left"></div>
            <div class="antenna right"></div>
        </div>
    </div>

    <div class="bee">
        <div class="wing left"></div>
        <div class="wing right"></div>
        <div class="body-bee">
            <div class="stripe"></div>
            <div class="stripe"></div>
        </div>
        <div class="head-bee">
            <div class="antenna left"></div>
            <div class="antenna right"></div>
        </div>
    </div>

    <div class="bee">
        <div class="wing left"></div>
        <div class="wing right"></div>
        <div class="body-bee">
            <div class="stripe"></div>
            <div class="stripe"></div>
        </div>
        <div class="head-bee">
            <div class="antenna left"></div>
            <div class="antenna right"></div>
        </div>
    </div>

    <div class="flowers left">
        <div class="flower">
            <div class="petal"></div>
            <div class="petal"></div>
            <div class="petal"></div>
            <div class="petal"></div>
            <div class="center"></div>
            <div class="stem"></div>
        </div>
        <div class="flower">
            <div class="petal"></div>
            <div class="petal"></div>
            <div class="petal"></div>
            <div class="petal"></div>
            <div class="center"></div>
            <div class="stem"></div>
        </div>
        <div class="flower">
            <div class="petal"></div>
            <div class="petal"></div>
            <div class="petal"></div>
            <div class="petal"></div>
            <div class="center"></div>
            <div class="stem"></div>
        </div>
    </div>

    <div class="characters">
        <div class="character">
            <div class="hello-kitty">
                <div class="ear left"></div>
                <div class="ear right"></div>
                <div class="head">
                    <div class="bow"></div>
                    <div class="eye left"></div>
                    <div class="eye right"></div>
                    <div class="nose"></div>
                    <div class="whiskers left-top"></div>
                    <div class="whiskers left-bottom"></div>
                    <div class="whiskers right-top"></div>
                    <div class="whiskers right-bottom"></div>
                </div>
                <div class="body"></div>
            </div>
        </div>

        <div class="holding-hands"></div>

        <div class="character">
            <div class="spiderman">
                <div class="head">
                    <div class="web-pattern"></div>
                    <div class="eye left"></div>
                    <div class="eye right"></div>
                </div>
                <div class="body">
                    <div class="spider-logo"></div>
                </div>
            </div>
        </div>
    </div>

    <div class="flowers right">
        <div class="flower">
            <div class="petal"></div>
            <div class="petal"></div>
            <div class="petal"></div>
            <div class="petal"></div>
            <div class="center"></div>
            <div class="stem"></div>
        </div>
        <div class="flower">
            <div class="petal"></div>
            <div class="petal"></div>
            <div class="petal"></div>
            <div class="petal"></div>
            <div class="center"></div>
            <div class="stem"></div>
        </div>
        <div class="flower">
            <div class="petal"></div>
            <div class="petal"></div>
            <div class="petal"></div>
            <div class="petal"></div>
            <div class="center"></div>
            <div class="stem"></div>
        </div>
    </div>
</body>
</html>
